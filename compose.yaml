services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ec_site
      POSTGRES_USER: ec_user
      POSTGRES_PASSWORD: ec_password
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec_user -d ec_site"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ec_site
      DB_USER: ec_user
      DB_PASSWORD: ec_password
    ports:
      - "8088:8080"
